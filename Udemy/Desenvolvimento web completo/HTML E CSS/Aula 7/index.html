<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divs and Span</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="topo" >
        <img  src="img/amazon.png" class="img">
        <ol>
            <li>Home</li>
            <li>Produtos</li>
            <li>Contato</li>
        </ol>
    </div>

    <div id="conteudo">
        <div class="produto">
            produto 1
        </div>
        <div class="produto">
            produto 2
        </div>
        <div class="produto">
            produto 3
        </div>

    </div>
    <!-- utilização do span, ferramenta inline e não block como a div -->
    <div>
        Todos os <span class="azul">direitos</span> reservados
    </div>


</body>
</html>
