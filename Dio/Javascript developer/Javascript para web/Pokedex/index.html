<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/global.css" />
    <link rel="stylesheet" href="./assets/css/pokedex.css">
    <title>Pokedex</title>
  </head>
  <body>
    <header>

    </header>

    <main>
        <section class="content">
            <div class="pokedex-title">
                <h1>Pokedex</h1>
            </div>

<!-- PESQUISA -->
<form id="searchForm" class="search">
    <input
        id="searchInput"
        type="text"
        placeholder="Digite o nome do Pokémon"
    >

    <button type="submit">
        Pesquisar
    </button>
</form>

<div class="pokedex-container">

    <!-- FILTROS -->
    <aside class="filters">

        <h2>Filtros</h2>

        <label for="generationFilter">
            Geração
        </label>

        <select id="generationFilter">
            <option value="all">Todas</option>
            <option value="1">Geração 1</option>
            <option value="2">Geração 2</option>
            <option value="3">Geração 3</option>
            <option value="4">Geração 4</option>
            <option value="5">Geração 5</option>
            <option value="6">Geração 6</option>
            <option value="7">Geração 7</option>
            <option value="8">Geração 8</option>
            <option value="9">Geração 9</option>
        </select>


        <label for="typeFilter">
            Tipo
        </label>

        <select id="typeFilter">
            <option value="all">Todos</option>
            <option value="normal">Normal</option>
            <option value="fire">Fogo</option>
            <option value="water">Água</option>
            <option value="electric">Elétrico</option>
            <option value="grass">Grama</option>
            <option value="ice">Gelo</option>
            <option value="fighting">Lutador</option>
            <option value="poison">Veneno</option>
            <option value="ground">Terra</option>
            <option value="flying">Voador</option>
            <option value="psychic">Psíquico</option>
            <option value="bug">Inseto</option>
            <option value="rock">Pedra</option>
            <option value="ghost">Fantasma</option>
            <option value="dragon">Dragão</option>
            <option value="dark">Sombrio</option>
            <option value="steel">Aço</option>
            <option value="fairy">Fada</option>
        </select>

    </aside>


    <div class="pokemon-area">

        <ol id="pokemonList" class="pokemons">
        </ol>

        <div class="pagination">
            <button id="loadMoreButton" type="button">
                Carregue mais
            </button>
        </div>

    </div>

</div>
<div id="pokemonModal" class="modal">

    <div class="modal-content">

        <button id="closeModal" class="close-modal">
            ×
        </button>

        <div id="pokemonDetails">
        </div>

    </div>

</div>

        </section>
    </main>

    <footer>

    </footer>
    <script src="./assets/js/pokemon-model.js"></script>
    <script src="./assets/js/poke-api.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
